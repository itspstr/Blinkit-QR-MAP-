<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLINKIT STORE QR LAYOUT MAP</title>
    <style>
        :root {
            --blinkit-yellow: #FFC200;
            --blinkit-green: #0C831F;
            --blinkit-green-hover: #0a6c19;
            --blinkit-dark: #111111;
            --bg-light: #F4F6F9;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --shadow-subtle: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 10px;
            color: var(--blinkit-dark);
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: relative;
            text-align: center;
            background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
            color: #fff;
            padding: 16px 14px 12px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-bottom: 4px solid var(--blinkit-yellow);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            flex-shrink: 0;
        }
        .version-badge {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 8.5px;
            font-weight: 800;
            background: rgba(255, 194, 0, 0.18);
            color: var(--blinkit-yellow);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 194, 0, 0.35);
            letter-spacing: 0.5px;
        }
        header h1 { 
            margin: 0; 
            font-size: 14px; 
            font-weight: 950; 
            color: var(--blinkit-yellow); 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        header p { 
            margin: 3px 0 0 0; 
            font-size: 9.5px; 
            color: #94a3b8; 
            font-weight: 500;
        }
        
        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 8.5px;
            font-weight: 800;
            color: #2ed573;
            background: rgba(46, 213, 115, 0.12);
            padding: 2px 8px;
            border-radius: 20px;
            margin-top: 6px;
            border: 1px solid rgba(46, 213, 115, 0.25);
        }
        .pulse-dot {
            width: 5px;
            height: 5px;
            background-color: #2ed573;
            border-radius: 50%;
            animation: pulse-glow 1.4s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0% { transform: scale(0.85); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 6px #2ed573; }
            100% { transform: scale(0.85); opacity: 0.5; }
        }

        .search-container { 
            position: sticky; 
            top: 4px; 
            z-index: 1000; 
            margin-bottom: 10px;
            width: 100%;
            background: var(--bg-light);
            padding-bottom: 4px;
        }
        #searchInput {
            width: 100%; 
            padding: 11px 14px; 
            border: 2px solid var(--blinkit-green); 
            border-radius: 10px;
            font-size: 12.5px; 
            font-weight: 700; 
            outline: none;
            background-color: #fff;
            box-shadow: 0 4px 12px rgba(12, 131, 31, 0.08);
            margin-bottom: 8px;
        }

        .filter-chips-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            width: 100%;
            scrollbar-width: none;
        }
        .filter-chips-container::-webkit-scrollbar { display: none; }
        .chip-btn {
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 10px;
            font-weight: 800;
            color: var(--blinkit-dark);
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            text-transform: uppercase;
        }
        .chip-btn.active {
            background: var(--blinkit-green);
            color: #fff;
            border-color: var(--blinkit-green);
            box-shadow: 0 4px 10px rgba(12, 131, 31, 0.25);
        }
        .clear-chip {
            background: #fff1f2;
            color: #e11d48;
            border-color: #fecdd3;
        }
        .clear-chip.active, .clear-chip:hover {
            background: #e11d48;
            color: #fff;
            border-color: #e11d48;
        }

        .spotlight-qr-panel {
            display: none;
            background: #fff;
            border: 2.5px solid var(--blinkit-green);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(12, 131, 31, 0.12);
        }
        .spotlight-title {
            font-size: 10px;
            font-weight: 900;
            color: var(--blinkit-green);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .spotlight-code {
            font-size: 15px;
            font-weight: 950;
            color: var(--blinkit-dark);
            margin-bottom: 8px;
            background: var(--blinkit-yellow);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
        }
        .spotlight-img-wrapper {
            background: #ffffff;
            padding: 8px;
            display: inline-block;
            border-radius: 8px;
            border: 2px solid #000;
        }
        .spotlight-img {
            width: 180px;
            height: 180px;
            display: block;
        }

        .scrollable-grid-panel {
            width: 100%;
            overflow-x: auto;
            display: flex;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }

        .parallel-floor-container {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            width: max-content;
        }

        .stacked-column-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 230px;
            flex-shrink: 0;
        }

        .cold-zone-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 710px; 
            flex-shrink: 0;
        }
        
        .cold-top-columns {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .row-column {
            width: 230px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            overflow: hidden;
            flex-shrink: 0;
        }

        .row-header {
            font-size: 11px; 
            font-weight: 900; 
            color: #fff;
            background: var(--blinkit-green);
            padding: 9px; 
            text-align: center;
            text-transform: uppercase;
        }
        .row-header-dark {
            background: var(--blinkit-dark);
            color: var(--blinkit-yellow);
        }

        .racks-accumulator {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #ffffff;
            min-height: 50px;
        }

        details {
            background: #f8fafc; 
            border: 1.5px solid var(--border-color); 
            border-radius: 8px;
            cursor: pointer;
        }
        details[open] { 
            background: #ffffff; 
            border-color: var(--blinkit-green); 
            box-shadow: 0 4px 12px rgba(12, 131, 31, 0.08);
        }
        summary {
            font-size: 10.5px; 
            font-weight: 800; 
            padding: 8px 10px; 
            color: var(--blinkit-dark);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            user-select: none;
        }
        summary::-webkit-details-marker { display: none; }
        
        .summary-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-right-indicator {
            font-size: 11px;
            color: var(--blinkit-green);
            font-weight: 950;
        }
        details[open] .summary-right-indicator {
            color: #e11d48;
        }
        
        .shelf-container {
            margin: 6px 4px; 
            background: #fff;
            border: 1px dashed #cbd5e1; 
            border-radius: 6px; 
            padding: 6px;
        }
        .shelf-label { 
            font-weight: 900; 
            color: #fff; 
            font-size: 8.5px; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            background: #334155; 
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
        }
        
        .qr-isolation-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 6px; 
        }
        
        .location-box { 
            background: var(--bg-light); 
            border-radius: 6px; 
            padding: 6px 4px; 
            text-align: center; 
            border: 1px solid #e2e8f0;
        }
        .code-tag { 
            font-size: 7.5px; 
            font-weight: 850; 
            display: block; 
            margin-bottom: 3px; 
            color: #475569; 
        }
        
        .qr-target-img { 
            width: 100%; 
            max-width: 52px; 
            height: auto; 
            display: block; 
            margin: 0 auto 4px auto; 
            background: #fff;
            padding: 1px;
            border-radius: 2px;
        }

        .item-view-btn {
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 8px;
            font-weight: 800;
            color: var(--blinkit-dark);
            cursor: pointer;
            width: 100%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .item-view-btn:active {
            transform: scale(0.95);
            background: var(--blinkit-yellow);
            border-color: var(--blinkit-yellow);
        }

        .bottom-shelf-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid var(--border-color);
            width: 100%;
            box-shadow: var(--shadow-subtle);
        }

        .section-banner {
            color: #fff; 
            text-align: center; 
            font-size: 10px; 
            font-weight: 900;
            padding: 8px; 
            border-radius: 8px; 
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            border-left: 4px solid var(--blinkit-yellow);
        }

        .floating-scroll-container {
            position: fixed;
            right: 14px;
            bottom: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .floating-scroll-btn {
            background: var(--blinkit-dark);
            color: var(--blinkit-yellow);
            border: 2px solid var(--blinkit-yellow);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }

        .bottom-control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
            width: 100%;
        }

        .download-apk-btn {
            background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
            color: #fff;
            border: 2px solid var(--blinkit-yellow);
            padding: 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 950;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .analytics-footer-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: var(--shadow-subtle);
        }
        .analytics-toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .analytics-title {
            font-size: 11px;
            font-weight: 950;
            color: var(--blinkit-dark);
            text-transform: uppercase;
        }
        .radio-group {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 10.5px;
            font-weight: 800;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .analytics-dashboard-content {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .analytics-dashboard-content.active {
            display: block;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .stat-card {
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 12.5px;
            font-weight: 950;
            color: var(--blinkit-green);
            margin-top: 2px;
        }
        .stat-label {
            font-size: 7.5px;
            font-weight: 900;
            color: #64748b;
            text-transform: uppercase;
        }

        footer {
            text-align: center; 
            padding: 14px; 
            margin-top: 10px;
            border-top: 1px solid var(--border-color); 
            font-size: 9.5px; 
            font-weight: 600; 
            color: #64748b;
            line-height: 1.5;
        }
        footer span { 
            color: var(--blinkit-dark); 
            font-weight: 900; 
        }
        .footer-copyright {
            font-size: 8.5px;
            font-weight: 850;
            color: var(--blinkit-green);
            margin-top: 2px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="floating-scroll-container">
        <button class="floating-scroll-btn" onclick="scrollToTop()" title="Scroll to Top">▲</button>
        <button class="floating-scroll-btn" onclick="scrollToBottom()" title="Scroll to Bottom">▼</button>
    </div>

    <header>
        <div class="version-badge">Ver2.2</div>
        <h1>BLINKIT STORE QR LAYOUT MAP</h1>
        <p>SS, George Town, Prayagraj — Floor Control Terminal</p>
        <div class="system-status">
            <div class="pulse-dot"></div>
            <span>LAYOUT MONITOR LIVE</span>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="⚡ Type location code to match instantly..." onkeyup="filterLocations()">
        
        <div class="filter-chips-container">
            <button class="chip-btn clear-chip" onclick="clearFilters()">🔄 Clear All</button>
            <button class="chip-btn" onclick="clipTargetZone('FV01')">🥦 FV</button>
            <button class="chip-btn" onclick="clipTargetZone('CR01')">🧺 CR</button>
            <button class="chip-btn" onclick="clipTargetZone('FR01')">❄️ FR</button>
            <button class="chip-btn" onclick="clipTargetZone('A04')">🗄️ A04</button>
            <button class="chip-btn" onclick="clipTargetZone('A05')">🗄️ A05</button>
            <button class="chip-btn" onclick="clipTargetZone('A06')">🗄️ A06</button>
            <button class="chip-btn" onclick="clipTargetZone('A07')">🗄️ A07</button>
        </div>
    </div>

    <div class="spotlight-qr-panel" id="spotlightPanel">
        <div class="spotlight-title">🎯 Spotlight Match Target</div>
        <div class="spotlight-code" id="spotlightCode">---</div>
        <div>
            <div class="spotlight-img-wrapper">
                <img class="spotlight-img" id="spotlightImg" src="" alt="Spotlight QR Target">
            </div>
        </div>
    </div>

    <div class="scrollable-grid-panel">
        <div class="parallel-floor-container" id="floorContainer">
            
            <div class="stacked-column-wrapper" id="stackedColLeft">
                <div class="row-column" id="col-A01">
                    <div class="row-header">Row A01</div>
                    <div id="container-A01" class="racks-accumulator"></div>
                </div>
                <div class="row-column" id="col-A07">
                    <div class="row-header row-header-dark">Row A07</div>
                    <div id="container-A07" class="racks-accumulator"></div>
                </div>
            </div>
            
            <div class="cold-zone-wrapper" id="coldZoneWrapper">
                <div class="cold-top-columns" id="coldTopCols">
                    <div class="row-column" id="col-A02">
                        <div class="row-header">Row A02</div>
                        <div id="container-A02" class="racks-accumulator"></div>
                    </div>
                    <div class="row-column" id="col-A03">
                        <div class="row-header">Row A03</div>
                        <div id="container-A03" class="racks-accumulator"></div>
                    </div>
                    <div class="row-column" id="col-A04">
                        <div class="row-header">Row A04</div>
                        <div id="container-A04" class="racks-accumulator"></div>
                    </div>
                </div>

                <div class="bottom-shelf-section" id="coldStorageSection">
                    <div class="section-banner">Cold Storage & Produce Zone 🥶</div>
                    <div style="display: flex; gap: 8px;" id="coldUnitsContainer">
                        <div style="flex: 1;" id="col-FV01" class="cold-unit-col">
                            <h4 style="margin: 0 0 6px 0; font-size: 10px; font-weight: 900; color: var(--blinkit-green);">🥦 FV01</h4>
                            <div id="container-FV01" class="racks-accumulator"></div>
                        </div>
                        <div style="flex: 1;" id="col-CR01" class="cold-unit-col">
                            <h4 style="margin: 0 0 6px 0; font-size: 10px; font-weight: 900; color: #0284c7;">🧺 CR01</h4>
                            <div id="container-CR01" class
